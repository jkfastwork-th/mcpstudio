# Install as:
#   /etc/systemd/system/mcp-studio.service.d/40-computer-gpu.conf
#
# Computer Use launches Chrome/WebGPU inside the MCP Studio service cgroup.
# Keep the device cgroup closed, expose only the DRM render node, and grant
# the service process the Unix group required to open that node.
[Service]
PrivateDevices=false
DevicePolicy=closed
DeviceAllow=/dev/dri/renderD128 rw
SupplementaryGroups=render
