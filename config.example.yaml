studio:
  production_mode: false
  bind_host: 0.0.0.0
  bind_port: 8100
  database: ./data/mcp-studio.sqlite3
  poll_interval_seconds: 15
  request_timeout_seconds: 8
  gateway_enabled: false
  gateway_auth_mode: bearer
  gateway_token_env: MCP_STUDIO_GATEWAY_TOKEN
  gateway_allowed_servers:
    - serena-8001

  max_workers: 4
  worker_server_id: serena-8001
  worker_heartbeat_timeout_seconds: 45
  worker_monitor_interval_seconds: 5
  herdr_poll_interval_seconds: 30

  scheduler_interval_seconds: 1.0
  scheduler_max_queue: 1000

  # M3 execution supervisor. Keep automatic dispatch disabled until live
  # certification passes. Manual/explicit dispatch remains available.
  execution_enabled: false
  execution_interval_seconds: 2.0
  execution_stall_seconds: 180
  execution_max_recoveries: 6
  execution_read_result: true
  execution_safe_redispatch: false

  # Per-managed-session tool permissions. Session metadata can override these defaults.
  # Unknown/unclassified tools fail closed; workspace scope blocks path escapes.
  #managed_session_tool_permissions_enabled: false
  #managed_session_default_read_allowed: true
  #managed_session_default_write_allowed: true
  #managed_session_default_execute_allowed: true
  #managed_session_default_destructive_allowed: false
  #managed_session_tool_permissions_fail_closed: true
  #managed_session_tool_scope_enforced: true
  # Allow paths inside registered sibling Git worktrees that share the same Git common dir.
  #managed_session_allow_git_worktree_siblings: false

  # HIRDA Graft read-only context plane.
  # Enabling this does not grant Graft source write/destructive authority.
  #graft_enabled: false
  #graft_cli_path: /opt/graft/dist/cli.js
  #graft_node_executable: node
  #graft_request_timeout_seconds: 30
  #graft_default_rollout_percent: 100

  # HIRDA Reflex local System-One decision core.
  #reflex_enabled: true
  #reflex_mode: enforce
  #reflex_evaluate_read_tools: false
  #reflex_min_confidence: 0.88
  #reflex_review_risk_threshold: 0.72
  #reflex_deny_risk_threshold: 0.92
  #reflex_dataset_enabled: true
  #reflex_dataset_path: ./data/reflex-decisions.jsonl

  # Jev is optional teacher/shadow evaluation, never runtime authority.
  # Deterministic permissions + HIRDA Reflex remain the execution authority.
  #jev_enabled: false
  #jev_mode: shadow
  #jev_api_url: https://api.typesafe.ai/v1/systemone
  #jev_api_key_env: TYPESAFE_API_KEY
  #jev_model: jev-latest
  #jev_timeout_seconds: 2.0
  #jev_min_confidence: 0.90
  #jev_suspicious_threshold: 0.90
  #jev_fail_closed: false
  #jev_evaluate_read_tools: false
  #jev_max_state_chars: 12000

  # HIRDA Reflex local System-One decision core.
  #reflex_enabled: true
  #reflex_mode: enforce
  #reflex_evaluate_read_tools: false
  #reflex_min_confidence: 0.88
  #reflex_review_risk_threshold: 0.72
  #reflex_deny_risk_threshold: 0.92
  #reflex_dataset_enabled: true
  #reflex_dataset_path: ./data/reflex-decisions.jsonl

  # Jev is optional teacher/shadow evaluation, never runtime authority.
  # Deterministic permissions + HIRDA Reflex remain the execution authority.
  #jev_enabled: false
  #jev_mode: shadow
  #jev_api_url: https://api.typesafe.ai/v1/systemone
  #jev_api_key_env: TYPESAFE_API_KEY
  #jev_model: jev-latest
  #jev_timeout_seconds: 2.0
  #jev_min_confidence: 0.90
  #jev_suspicious_threshold: 0.90
  #jev_fail_closed: false
  #jev_evaluate_read_tools: false
  #jev_max_state_chars: 12000

  # JAA-2 generic ActionProvider registry. Entry-point loading executes trusted
  # installed provider package code, so discovery is opt-in.
  #action_provider_entrypoints_enabled: false
  #action_provider_entrypoint_group: hirda.action_providers

  # Generic HIRDA integration discovery. Enable only for trusted installed
  # packages because Python entry-point loading executes package code.
  #integration_entrypoints_enabled: false
  #integration_entrypoint_group: hirda.integrations

  # Local plugin-folder discovery + P3 trusted activation. Discovery never
  # imports code; runtime activation additionally requires an exact fingerprint.
  #integration_plugin_folder_enabled: true
  #integration_plugin_folder_path: ./plugins
  #integration_plugin_manifest_name: hirda-plugin.yaml
  #integration_plugin_max_count: 128
  #integration_plugin_runtime_enabled: false
  #integration_plugin_trusted_fingerprints: []

  # HIRDA machine-control backend. The raw Desktop Commander MCP is not
  # exposed to lanes; backend tools remain under HIRDA permission/scope gates.
  #desktop_commander_backend_enabled: false
  #desktop_commander_backend_binary: desktop-commander
  #desktop_commander_backend_timeout_seconds: 15.0
  #desktop_commander_backend_cwd: /home/alfred

  # Multi-machine registry. Remote agents should listen only on a private
  # interface (for example Tailscale) and reference a token file, never plaintext.
  #machine_local_id: openclaw
  #machine_registry:
  #  - id: openclaw
  #    name: openclaw
  #    local: true
  #    capabilities: [filesystem, process, computer_use]
  #    policy:
  #      read: true
  #      write: true
  #      execute: true
  #      destructive: false
  #      fail_closed_unknown: true
  #    providers:
  #      desktop_commander: {mode: local}
  #      computer_use: {mode: local}
  #  - id: windows-dev
  #    name: Windows Dev
  #    address: 100.64.0.10
  #    capabilities: [filesystem, process]
  #    policy:
  #      read: true
  #      write: true
  #      execute: false
  #      destructive: false
  #      fail_closed_unknown: true
  #    providers:
  #      desktop_commander:
  #        mode: agent
  #        endpoint: http://100.64.0.10:8765
  #        token_file: ~/.config/hirda/windows-dev.token
  #    workspace_map:
  #      example: C:\Users\me\HIRDA\workspaces\example

  # Safe auto-onboarding: HIRDA scans online Tailnet peers for a machine agent,
  # records unknown nodes as pending, and requires explicit approval.
  #machine_enrollment_enabled: false
  #machine_enrollment_state_path: data/machine-enrollment.json
  #machine_enrollment_agent_port: 8765
  #machine_enrollment_probe_timeout_seconds: 2.0
  #machine_enrollment_discovery_interval_seconds: 60.0
  #machine_enrollment_allowed_cidrs: [100.64.0.0/10, "fd7a:115c:a1e0::/48"]
  #machine_enrollment_default_policy:
  #  read: true
  #  write: false
  #  execute: false
  #  destructive: false
  #  fail_closed_unknown: true

  # P8 deterministic pixel-art candidate provider.
  # Install/pin upstream with: uv run python scripts/bootstrap-pixel-art-studio.py
  #pixel_art_studio_enabled: false
  #pixel_art_studio_root: ./.hirda-cache/pixel-art-studio
  #pixel_art_studio_output_root: ./data/visual-candidates/pixel-art-studio
  #pixel_art_studio_expected_commit: f8c246635c4621a6c2b427833149afdc3dc3c719

  # HCR cognitive fabric. Plan/shadow mode and execution are separate gates.
  #cognitive_router_enabled: false
  #cognitive_router_execute_enabled: false
  #cognitive_router_default_timeout_seconds: 30.0

  # M6.2.5 Computer Use / Web VNC MVP.
  #computer_use_enabled: false
  #computer_vnc_host: 127.0.0.1
  #computer_vnc_port: 5902
  #computer_websockify_host: 127.0.0.1
  #computer_websockify_port: 6080
  #computer_cdp_port: 9222
  #computer_novnc_dir: /usr/share/novnc
  #computer_auth_token: ""
  # Per-managed-session desktop isolation. When enabled, VNC/CDP ports above
  # are base ports; each managed session gets its own free slot; occupied displays/ports are skipped.
  #computer_session_isolation_enabled: false
  #computer_runtime_dir: ./data/computers
  #computer_vnc_display_base: 2
  #computer_vnc_password_file: ~/.vnc/passwd
  #computer_chrome_binary: ""
  # computer_gpu_mode: auto | hardware | swiftshader
  # auto prefers a host render device and falls back to SwiftShader.
  # In isolated VNC mode, hardware presentation uses nested Weston/Wayland
  # so Chromium can keep GL compositing while WebGPU uses the host Vulkan GPU.
  #computer_gpu_mode: auto
  #computer_geometry: 1440x900
  #computer_adopt_workspace: ""
