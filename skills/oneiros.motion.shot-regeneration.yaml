schema: hirda-skill-v1
id: oneiros.motion.shot-regeneration
name: Oneiros Shot Regeneration
version: 0.1.0
description: Declarative guidance for regenerating a selected Oneiros shot or dependent shots from a user-selected per-shot anchor.
scope:
  kind: workspace
  value: nova-oracle-desktop
triggers:
  - regenerate shot
  - regenerate from here
  - regenerate selected shot
  - regenerate only selected shot
  - regenerate only the selected shot
  - change shot anchor
  - reselect shot anchor
  - สร้างช็อตนี้ใหม่
  - ช่วยสร้างช็อตนี้ใหม่
  - สร้างใหม่จากตรงนี้
  - สร้างเฉพาะช็อตที่เลือกใหม่
  - เปลี่ยนจุดอ้างอิงช็อต
  - เลือกจุดอ้างอิงช็อตใหม่
required_capabilities:
  - oneiros.shot_context.read
  - oneiros.character_bible_reference_context.read
  - oneiros.shot_anchor.select
  - oneiros.shot_video.generate
  - oneiros.provenance_evidence.record
policy_hints:
  - Preserve the exact Character Library and Character Bible identity, outfit, and reference constraints for every affected shot.
  - The anchor is per-shot and user-changeable; resolve the latest anchor selected by the user for the target shot.
  - Regenerate-from-here requires explicit acknowledgement of the affected-shot impact set before generation.
  - Never silently overwrite accepted shots or prior shots outside the requested affected set.
  - Downstream dependent shots may be marked stale or regenerated only from the user-chosen boundary.
  - Preserve provenance and evidence for the selected anchor, generation source, and each affected-shot result.
  - A generation source that fails Character Bible or continuity verification must not be promoted.
workflow_steps:
  - Load the target shot and scene context.
  - Resolve the latest user-selected anchor for the target shot.
  - Load the Character Library or Character Bible and relevant environment reference.
  - Determine whether the request affects only the selected shot or starts from the chosen anchor boundary.
  - Generate only the shots in the determined affected set.
  - Verify continuity, character identity, outfit, environment, and camera constraints.
  - Record provenance, evidence, and the affected-shot result.
verification_checks:
  - Character identity, outfit, and reference constraints match the Character Library or Character Bible.
  - The selected anchor and its source are recorded for the target shot.
  - Accepted and unaffected prior shots remain unchanged.
  - The downstream impact set matches the user-requested boundary.
  - Each generated asset passes continuity and Character Bible checks before promotion.
metadata:
  domain: oneiros.motion
  package: oneiros
