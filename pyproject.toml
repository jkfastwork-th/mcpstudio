[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-studio"
version = "0.9.10"
description = "Production Linux MCP control plane for Serena/Herdr with ChatGPT OAuth continuity, operations hardening, observability, and SLO telemetry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0,<7",
  "jinja2>=3.1,<4",
  "websockets>=13,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1"]

[tool.setuptools]
packages = ["mcp_studio"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
