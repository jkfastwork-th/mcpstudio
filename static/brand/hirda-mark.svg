<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 150" role="img" aria-labelledby="title desc">
<title id="title">HIRDA three-headed origami dragon</title>
<desc id="desc">Three angular dragon heads assembled from separated origami facets.</desc>
<defs>
  <linearGradient id="hirdaBlue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F4F7FB"/>
    <stop offset=".38" stop-color="#AFC7FF"/>
    <stop offset=".72" stop-color="#3569F4"/>
    <stop offset="1" stop-color="#665AF7"/>
  </linearGradient>
  <linearGradient id="hirdaDeep" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#DCE7FF"/>
    <stop offset=".55" stop-color="#668EFF"/>
    <stop offset="1" stop-color="#243A91"/>
  </linearGradient>
</defs>

