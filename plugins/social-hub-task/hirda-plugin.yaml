schema: hirda-plugin-v1
id: social-hub-task
name: Social Hub Task Ingress
version: 1.2.0
adapter:
  runtime: python
  entry: adapter.py
  class: SocialHubTaskIntegration
capabilities:
  - social_hub_task_ingress
tools:
  - social_task_create
  - social_task_attach_asset
  - social_task_status
permissions:
  social_task_create: write
  social_task_attach_asset: write
  social_task_status: read
health:
  type: adapter_probe
routing:
  mode: local-http-backend
  preferred_lanes: [chatgpt]
metadata:
  executor_identity: fern
  owner_social_accounts: true
  runtime_authority: hirda
  governance_authority: false
