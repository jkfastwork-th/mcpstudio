# Shared HIRDA Device Runtime (P4)
# Same core config shape is used on Windows, Linux, macOS, CLI, and headless.
control_plane_url: https://serena.jkfast.work
name: my-device

# P4 portable fallback. P5/P6/P7 may replace storage with platform key stores.
identity_path: .hirda/device-key.pem

capabilities:
  - filesystem
  - process

# HIRDA Native Computer is the primary local filesystem/process provider.
# Desktop Commander is optional and used only for legacy tools the native
# provider does not expose; it is never retried after an ambiguous failure.
#desktop_commander_command:
#  - desktop-commander
desktop_commander_timeout_seconds: 15

# N3 vendor-neutral runtime/backend probes. Adapters may add provider-specific
# presets, but the shared runtime only understands this generic contract.
backend_probes: []
# Example shape:
# backend_probes:
#   - id: local-inference
#     kind: inference
#     command: [my-runtime]
#     version_args: [--version]
#     capabilities: [text-generation]
#     model_capabilities: [chat]
#     model_probe:
#       command: [my-runtime, models, --json]
#       format: json
#       json_path: [models]
#       id_field: id
#       name_field: name
#     health_probe:
#       command: [my-runtime, health]
#       timeout_seconds: 2

# Logical HIRDA workspace key -> local path on THIS device.
# The control plane sends only the key, never its own absolute path.
workspaces:
  mcp-studio: ./workspaces/mcp-studio

heartbeat_seconds: 15
reconnect_min_seconds: 1
reconnect_max_seconds: 30
runtime_version: "0.1"
